<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#f7f7f5" />
  <link rel="icon" href="data:," />
  <title>Peter Carmines</title>
  <meta name="description" content="The personal site of Peter Carmines, a practical problem solver based in Salisbury, Maryland." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Peter Carmines" />
  <meta property="og:description" content="Field work, technology, and practical problem solving." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500&family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #f7f7f5;
      --ink: #141516;
      --muted: #65696c;
      --line: #cfd1d1;
      --soft: #eceeed;
      --accent: #2f5d66;
      --mono: "Azeret Mono", monospace;
      --sans: "Libre Franklin", sans-serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    button,
    input,
    textarea { font: inherit; }
    button,
    a { -webkit-tap-highlight-color: transparent; }

    .playground {
      position: relative;
      min-height: max(620px, 100svh);
      overflow: hidden;
      border-bottom: 1px solid var(--line);
      background: var(--paper);
    }
    .topline {
      position: absolute;
      z-index: 4;
      inset: 0 0 auto;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      width: min(1180px, calc(100% - 56px));
      min-height: 72px;
      margin: 0 auto;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .06em;
      text-transform: uppercase;
      pointer-events: none;
    }
    .game-stage {
      position: absolute;
      inset: 73px 0 0;
    }
    .name {
      position: absolute;
      z-index: 2;
      top: 48%;
      left: 50%;
      display: flex;
      justify-content: center;
      align-items: baseline;
      gap: 0;
      width: min(1180px, calc(100% - 56px));
      margin: 0;
      font-family: var(--sans);
      font-size: clamp(58px, 9.8vw, 146px);
      font-weight: 600;
      line-height: .88;
      letter-spacing: -.075em;
      white-space: nowrap;
      transform: translate(-50%, -58%);
    }
    .word-space {
      width: .33em;
      flex: 0 0 .33em;
    }
    .letter-shell {
      display: inline-grid;
      place-items: center;
      will-change: transform;
      transition: transform 900ms cubic-bezier(.2, .78, .2, 1);
    }
    .letter {
      display: block;
      border: 0;
      padding: 0;
      color: inherit;
      background: transparent;
      font: inherit;
      line-height: inherit;
      letter-spacing: inherit;
      cursor: pointer;
      transform-origin: center;
      transition: color 160ms ease;
    }
    .letter:hover { color: var(--accent); }
    .letter:focus-visible {
      outline: 1px solid var(--accent);
      outline-offset: 7px;
    }
    .letter-glyph {
      display: block;
      pointer-events: none;
    }
    .name.is-scattered .letter { color: var(--piece-color, var(--ink)); }
    .name.is-scattered .letter-glyph {
      animation: float var(--float-time, 4.2s) ease-in-out var(--float-delay, 0s) infinite alternate;
    }
    .name.is-returning .letter-glyph { animation: none; }

    @keyframes float {
      0% { transform: translate3d(-2px, -5px, 0) rotate(-1.4deg); }
      50% { transform: translate3d(3px, 3px, 0) rotate(.8deg); }
      100% { transform: translate3d(-1px, 7px, 0) rotate(1.8deg); }
    }

    .intro,
    .contact {
      width: min(1080px, calc(100% - 56px));
      margin: 0 auto;
    }
    .intro {
      display: grid;
      grid-template-columns: minmax(150px, .35fr) minmax(0, 1fr);
      gap: clamp(40px, 8vw, 120px);
      padding: clamp(82px, 11vw, 150px) 0;
    }
    .section-label {
      margin: 7px 0 0;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .intro-copy h2 {
      max-width: 790px;
      margin: 0;
      font-size: clamp(32px, 5vw, 62px);
      font-weight: 500;
      line-height: 1.06;
      letter-spacing: -.045em;
    }
    .intro-copy p {
      max-width: 660px;
      margin: 0;
      color: #333638;
      font-size: clamp(16px, 1.7vw, 19px);
      line-height: 1.72;
    }
    .intro-copy p + p { margin-top: 16px; }

    .contact-wrap {
      border-top: 1px solid var(--line);
      background: var(--soft);
    }
    .contact {
      display: grid;
      grid-template-columns: minmax(220px, .65fr) minmax(0, 1.35fr);
      gap: clamp(48px, 10vw, 150px);
      padding: clamp(76px, 10vw, 126px) 0;
    }
    .contact-intro h2 {
      margin: 0 0 20px;
      font-size: clamp(34px, 4.6vw, 56px);
      font-weight: 500;
      letter-spacing: -.04em;
      line-height: 1.06;
    }
    .contact-intro p {
      max-width: 360px;
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }
    .contact-form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px 24px;
    }
    .field {
      display: grid;
      gap: 9px;
    }
    .field-message { grid-column: 1 / -1; }
    label {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .055em;
      text-transform: uppercase;
    }
    input,
    textarea {
      width: 100%;
      border: 0;
      border-bottom: 1px solid #a7abaa;
      border-radius: 0;
      padding: 11px 0 13px;
      background: transparent;
      color: var(--ink);
      font-size: 16px;
      line-height: 1.45;
      outline: none;
      appearance: none;
    }
    textarea {
      min-height: 112px;
      resize: vertical;
    }
    input::placeholder,
    textarea::placeholder { color: #858988; opacity: 1; }
    input:focus,
    textarea:focus { border-bottom-color: var(--accent); }
    .form-actions {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-top: 2px;
    }
    .submit-button {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 46px;
      min-width: 178px;
      border: 1px solid var(--ink);
      padding: 14px 16px;
      background: var(--ink);
      color: var(--paper);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .05em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 160ms ease, color 160ms ease;
    }
    .submit-button::after { content: "↗"; font-size: 13px; }
    .submit-button:hover,
    .submit-button:focus-visible {
      background: transparent;
      color: var(--ink);
      outline: none;
    }
    .form-note {
      margin: 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
      text-align: right;
    }
    .honeypot {
      position: absolute;
      left: -9999px;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      width: min(1080px, calc(100% - 56px));
      margin: 0 auto;
      padding: 23px 0 28px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    @media (max-width: 760px) {
      .playground { min-height: max(610px, 100svh); }
      .topline { width: calc(100% - 34px); min-height: 62px; }
      .game-stage { inset: 63px 0 0; }
      .name {
        top: 45%;
        flex-wrap: wrap;
        width: calc(100% - 34px);
        row-gap: .2em;
        font-size: clamp(54px, 16.7vw, 88px);
        line-height: .7;
        white-space: normal;
        transform: translate(-50%, -55%);
      }
      .word-space {
        flex-basis: 100%;
        width: 100%;
        height: 0;
      }
      .intro,
      .contact,
      footer { width: calc(100% - 34px); }
      .intro,
      .contact { grid-template-columns: 1fr; gap: 39px; }
      .intro { padding: 78px 0 88px; }
      .section-label { margin: 0; }
      .contact { padding: 72px 0 82px; }
      .contact-form { grid-template-columns: 1fr; gap: 25px; }
      .field-message,
      .form-actions { grid-column: auto; }
      .form-actions {
        align-items: flex-start;
        flex-direction: column;
      }
      .submit-button { width: 100%; }
      .form-note { text-align: left; }
      footer { flex-direction: column; gap: 8px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .letter-shell { transition-duration: 1ms; }
      .name.is-scattered .letter-glyph { animation: none; }
      .submit-button { transition: none; }
    }

    @media print {
      .playground { min-height: 430px; }
      .name { font-size: 88px; }
      .intro,
      .contact { padding: 58px 0; }
      .contact-wrap { background: white; }
    }
  </style>
</head>
<body>
  <main>
    <section class="playground" aria-labelledby="nameHeading">
      <div class="topline" aria-hidden="true"></div>

      <div class="game-stage" id="gameStage">
        <h1 class="name" id="nameHeading" aria-label="Peter Carmines">
          <span class="letter-shell"><button class="letter" type="button" aria-label="Scatter Peter Carmines"><span class="letter-glyph" aria-hidden="true">P</span></button></span>
          <span class="letter-shell"><button class="letter" type="button" aria-label="Scatter Peter Carmines"><span class="letter-glyph" aria-hidden="true">e</span></button></span>
          <span class="letter-shell"><button class="letter" type="button" aria-label="Scatter Peter Carmines"><span class="letter-glyph" aria-hidden="true">t</span></button></span>
          <span class="letter-shell"><button class="letter" type="button" aria-label="Scatter Peter Carmines"><span class="letter-glyph" aria-hidden="true">e</span></button></span>
          <span class="letter-shell"><button class="letter" type="button" aria-label="Scatter Peter Carmines"><span class="letter-glyph" aria-hidden="true">r</span></button></span>
          <span class="word-space" aria-hidden="true"></span>
          <span class="letter-shell"><button class="letter" type="button" aria-label="Scatter Peter Carmines"><span class="letter-glyph" aria-hidden="true">C</span></button></span>
          <span class="letter-shell"><button class="letter" type="button" aria-label="Scatter Peter Carmines"><span class="letter-glyph" aria-hidden="true">a</span></button></span>
          <span class="letter-shell"><button class="letter" type="button" aria-label="Scatter Peter Carmines"><span class="letter-glyph" aria-hidden="true">r</span></button></span>
          <span class="letter-shell"><button class="letter" type="button" aria-label="Scatter Peter Carmines"><span class="letter-glyph" aria-hidden="true">m</span></button></span>
          <span class="letter-shell"><button class="letter" type="button" aria-label="Scatter Peter Carmines"><span class="letter-glyph" aria-hidden="true">i</span></button></span>
          <span class="letter-shell"><button class="letter" type="button" aria-label="Scatter Peter Carmines"><span class="letter-glyph" aria-hidden="true">n</span></button></span>
          <span class="letter-shell"><button class="letter" type="button" aria-label="Scatter Peter Carmines"><span class="letter-glyph" aria-hidden="true">e</span></button></span>
          <span class="letter-shell"><button class="letter" type="button" aria-label="Scatter Peter Carmines"><span class="letter-glyph" aria-hidden="true">s</span></button></span>
        </h1>
      </div>
    </section>

    <section class="intro" aria-labelledby="aboutTitle">
      <p class="section-label">About</p>
      <div class="intro-copy">
        <h2 id="aboutTitle">I work in commercial energy efficiency. I like surfing and the outdoors.</h2>
      </div>
    </section>

    <div class="contact-wrap">
      <section class="contact" aria-labelledby="contactTitle">
        <div class="contact-intro">
          <h2 id="contactTitle">Send a note.</h2>
          <p>If you’d like to get in touch, leave a message here. I’ll reply by email.</p>
        </div>

        <form class="contact-form" id="contactForm" action="https://formsubmit.co/petercarmines@gmail.com" method="POST">
          <input type="hidden" name="_subject" value="New message from petercarmines.com" />
          <input type="hidden" name="_template" value="table" />
          <input type="hidden" name="_captcha" value="false" />
          <div class="honeypot" aria-hidden="true">
            <label for="companyWebsite">Leave this field empty</label>
            <input id="companyWebsite" type="text" name="_honey" tabindex="-1" autocomplete="off" />
          </div>
          <div class="field">
            <label for="contactName">Name</label>
            <input id="contactName" name="name" type="text" autocomplete="name" placeholder="Your name" required />
          </div>
          <div class="field">
            <label for="contactEmail">Email</label>
            <input id="contactEmail" name="email" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com" required />
          </div>
          <div class="field field-message">
            <label for="contactMessage">Message</label>
            <textarea id="contactMessage" name="message" placeholder="What’s on your mind?" required></textarea>
          </div>
          <div class="form-actions">
            <button class="submit-button" type="submit">Send message</button>
            <p class="form-note">All fields are required.</p>
          </div>
        </form>
      </section>
    </div>
  </main>

  <footer>
    <span>© 2026 Peter Carmines</span>
    <span>Salisbury, Maryland</span>
  </footer>

  <script>
    const name = document.getElementById('nameHeading');
    const stage = document.getElementById('gameStage');
    const shells = [...name.querySelectorAll('.letter-shell')];
    const letters = [...name.querySelectorAll('.letter')];
    const palette = ['#141516', '#2f5d66', '#4b5053', '#141516'];
    let scattered = false;
    let returnTimer;

    shells.forEach((shell, index) => {
      shell.style.setProperty('--piece-color', palette[index % palette.length]);
      shell.style.setProperty('--float-time', `${3.7 + (index % 5) * .33}s`);
      shell.style.setProperty('--float-delay', `${-(index % 7) * .21}s`);
    });

    function shuffle(items) {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function scatter() {
      window.clearTimeout(returnTimer);
      name.classList.remove('is-returning');
      const stageRect = stage.getBoundingClientRect();
      const compact = window.innerWidth <= 760;
      const columns = compact ? 3 : 5;
      const rows = Math.ceil(shells.length / columns);
      const padX = compact ? 38 : 72;
      const padTop = compact ? 46 : 55;
      const padBottom = compact ? 112 : 105;
      const usableWidth = Math.max(1, stageRect.width - padX * 2);
      const usableHeight = Math.max(1, stageRect.height - padTop - padBottom);
      const cellWidth = usableWidth / columns;
      const cellHeight = usableHeight / rows;
      const cells = shuffle(shells.map((_, index) => index));

      shells.forEach((shell, index) => {
        const rect = shell.getBoundingClientRect();
        const cell = cells[index];
        const column = cell % columns;
        const row = Math.floor(cell / columns);
        const jitterX = (Math.random() - .5) * cellWidth * .4;
        const jitterY = (Math.random() - .5) * cellHeight * .34;
        const targetX = stageRect.left + padX + cellWidth * (column + .5) + jitterX;
        const targetY = stageRect.top + padTop + cellHeight * (row + .5) + jitterY;
        const currentX = rect.left + rect.width / 2;
        const currentY = rect.top + rect.height / 2;
        const rotation = (Math.random() - .5) * 16;
        shell.style.transform = `translate3d(${targetX - currentX}px, ${targetY - currentY}px, 0) rotate(${rotation}deg)`;
      });

      scattered = true;
      name.classList.add('is-scattered');
      letters.forEach(letter => { letter.setAttribute('aria-label', 'Return Peter Carmines'); });
    }

    function returnHome() {
      name.classList.remove('is-scattered');
      name.classList.add('is-returning');
      shells.forEach(shell => { shell.style.transform = ''; });
      scattered = false;
      letters.forEach(letter => { letter.setAttribute('aria-label', 'Scatter Peter Carmines'); });
      returnTimer = window.setTimeout(() => name.classList.remove('is-returning'), 950);
    }

    letters.forEach(letter => {
      letter.addEventListener('click', () => scattered ? returnHome() : scatter());
    });

    window.addEventListener('resize', () => {
      if (scattered) returnHome();
    });
  </script>
</body>
</html>
